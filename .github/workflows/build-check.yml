# 2026-09-05 repo 重建(切斷 fork 網路)後,dispatch-only workflow 需要一次 push 才會重新註冊。
name: Build Check

# 🔴 觸發分支要涵蓋「實際有人動的分支」,不是只有上游鏡像分支。
#    workflow 跑的 repo 是 myfork(okaminico/AutoDuty-TC),那裡沒有人動 tc-7.20
#    —— 它是純上游鏡像(見 plugin-fork-standards.md 第 3 節的三層分支模型),
#    真正在改的是 tw-fix 與 customize。只列 tc-7.20 等於這份檢查在 myfork 上
#    永遠不會跑,手動 push 上去的東西完全沒人把關(兩份 sync workflow 內建的
#    建置檢查只保護「自動合併」那條路徑)。
on:
  push:
    branches:
      - 'tc-7.20'
      - 'tw-fix'
      - 'customize'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - 'tc-7.20'
      - 'tw-fix'
      - 'customize'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # 🔴 resx 的「鍵存在但值為空」是崩潰級缺陷,不是風格問題:
      #    ResourceManager 回 "" 而**不會** fallback → ImGui 拿到零長度 span →
      #    fixed 取指標為 null → igFindRenderedTextEnd 從位址 0 掃 → C0000005。
      #    「鍵不存在」反而安全(會正常退回中性資源)。
      #    上游 crowdin 的 "New translations *.resx" 合併會把這種地雷帶回來,
      #    所以擋在建置之前。腳本純標準函式庫、自帶校準閘門(G1~G7)。
      - name: Check resx empty values
        shell: pwsh
        run: python .github/scripts/check_resx_empty.py
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # 10.x:子模組 WrathCombo.API 的 LangVersion 是 14(上游用了 C# 14 的 extension 區塊
          # 與 field 關鍵字),必須用 .NET 10 SDK 才編得動。目標框架仍是 net9 / API13,不變。
          dotnet-version: 10.x
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\xivlauncher\Addon\Hooks\dev\"
      - name: Build with dotnet
        run: dotnet build --configuration Release AutoDuty/AutoDuty.csproj -p:DalamudLibPath="$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
