name: Sync tw-fix into customize & Auto Release

# 每天把 tw-fix（已經合併過 ffxiv-tc-port/AutoDuty tc-7.20 上游、且建置驗證過）同步進 customize。
# customize 是實際發布給朋友的版本，可能疊了 tw-fix 沒有的個人專屬調整。
# 只有在「合併乾淨（無衝突） 且 建置成功」時，才會推送、發新版 release、更新 repo.json。
# 只要遇到合併衝突或建置失敗，就整個跳過不動、工作流程標記失敗，等你手動處理，
# 不會有半殘的東西被推上去或發佈給朋友。

# ⚠️ remote 命名:這裡的 origin 跟你本機的 origin 不是同一個 repo。
#    Actions 裡的 origin ＝ workflow 所在的 repo ＝ myfork(okaminico/AutoDuty-TC);
#    本機的 origin ＝ ffxiv-tc-port/AutoDuty(見 CLAUDE.md 的 remote 慣例),
#    而本機的 upstream ＝ 原始上游 awgil/AutoDuty。三個地方同一個字三個意思。
#    底下的 origin 全部都是 myfork —— 這份 workflow 的來源是「同一個 repo 裡的
#    tw-fix」,不是任何外部上游,所以它完全不需要新增 remote。

on:
  schedule:
    - cron: '30 18 * * *' # 每天 UTC 18:30（台灣時間 02:30，排在 sync-tc-upstream.yml 之後)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Checkout customize
        uses: actions/checkout@v5
        with:
          ref: customize
          submodules: recursive
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch tw-fix
        run: git fetch origin tw-fix

      - name: Merge tw-fix
        id: merge
        shell: pwsh
        run: |
          $before = git rev-parse HEAD
          git merge --no-edit origin/tw-fix
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::合併發生衝突，中止並跳過本次自動流程"
            git merge --abort
            "status=conflict" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $after = git rev-parse HEAD
          if ($before -eq $after) {
            "status=nochange" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "status=merged" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Update submodules after merge
        if: steps.merge.outputs.status == 'merged'
        run: git submodule update --init --recursive

      - name: Install .NET
        if: steps.merge.outputs.status == 'merged'
        uses: actions/setup-dotnet@v5
        with:
          # 子模組 WrathCombo.API 用了 C# 14 的語法，要 .NET 10 SDK 才編得動；
          # 目標框架本身仍是 net9 / API13，跟 release.yml 用同一個理由。
          dotnet-version: 10.x

      - name: Download Dalamud (pinned TC-compatible build)
        if: steps.merge.outputs.status == 'merged'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"

      - name: Build
        id: build
        if: steps.merge.outputs.status == 'merged'
        shell: pwsh
        run: |
          $current = (Get-Content -Raw repo.json | ConvertFrom-Json)[0].AssemblyVersion
          $currentBuild = [int]($current -split '\.')[3]
          $ver = "7.15.1." + ($currentBuild + 1)
          dotnet build --configuration Release AutoDuty/AutoDuty.csproj -p:DalamudLibPath="$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\" -p:Version=$ver -p:AssemblyVersion=$ver -p:FileVersion=$ver
          if ($LASTEXITCODE -ne 0) {
            "status=failed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          "status=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $json = Get-Content -Raw './AutoDuty/bin/Release/AutoDuty/AutoDuty.json' | ConvertFrom-Json
          $json.AssemblyVersion = $ver
          $json | ConvertTo-Json | Set-Content -Path './AutoDuty/bin/Release/AutoDuty/AutoDuty.json'
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Update repo.json
        if: steps.merge.outputs.status == 'merged' && steps.build.outputs.status == 'success'
        shell: pwsh
        run: |
          $ver = "${{ steps.build.outputs.version }}"
          $tag = "AutoDuty-v$ver-autosync"
          $json = Get-Content -Raw repo.json | ConvertFrom-Json
          $json[0].AssemblyVersion = $ver
          $json[0].DownloadLinkInstall = "https://github.com/${{ github.repository }}/releases/download/$tag/latest.zip"
          $json[0].DownloadLinkUpdate = "https://github.com/${{ github.repository }}/releases/download/$tag/latest.zip"
          $json[0].Changelog = "自動同步 tw-fix 更新（$(Get-Date -Format 'yyyy-MM-dd')）。"
          $json | ConvertTo-Json -Depth 10 -AsArray | Set-Content -Path repo.json
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Rename artifact to latest.zip for release
        if: steps.merge.outputs.status == 'merged' && steps.build.outputs.status == 'success'
        shell: pwsh
        run: |
          Copy-Item './AutoDuty/bin/Release/AutoDuty/latest.zip' -Destination 'latest.zip'

      - name: Commit and push
        if: steps.merge.outputs.status == 'merged' && steps.build.outputs.status == 'success'
        run: |
          git add repo.json
          git commit -m "Auto-sync tw-fix + republish ($env:TAG)"
          git push origin customize

      - name: Create release
        if: steps.merge.outputs.status == 'merged' && steps.build.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "AutoDuty ${{ steps.build.outputs.version }}（自動同步 customize）"
          target_commitish: customize
          files: |
            latest.zip
          generate_release_notes: false

      - name: Report unfinished sync
        if: steps.merge.outputs.status == 'conflict' || steps.build.outputs.status == 'failed'
        run: |
          echo "::error::自動同步未完成（merge=${{ steps.merge.outputs.status }}, build=${{ steps.build.outputs.status }}），需要手動處理"
          exit 1
