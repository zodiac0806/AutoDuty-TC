Adds a Comment to the path; AutoDuty will do nothing but display them.\nExample: <-- Trash Pack #1 -->==在路徑中新增一段註解；AutoDuty 不會執行任何動作，只會顯示註解。\nExample: <-- Trash Pack #1 -->
Adds a Wait (for x milliseconds) step to the path; after moving to the position, AutoDuty will wait x milliseconds.\nExample: Wait|0.02, 23.85, -394.89|8000==在路徑中新增一個等待步驟（等待 x 毫秒）；移動到該座標後，AutoDuty 會等待 x 毫秒。\nExample: Wait|0.02, 23.85, -394.89|8000
Adds a WaitFor (Condition) step to the path; after moving to the position, AutoDuty will wait for a condition from the following list:\nCombat - waits until in combat\nIsReady - waits until the player is ready\nIsValid - waits until the player is valid\nIsOccupied - waits until the player is occupied\nBNpcInRadius - waits until a battle npc either spawns or path's into the radius specified\nExample: WaitFor|-12.12, 18.76, -148.05|Combat==在路徑中新增一個等待條件步驟；移動到該座標後，AutoDuty 會等待下列清單中的其中一種條件：\nCombat - 等待進入戰鬥\nIsReady - 等待玩家就緒\nIsValid - 等待玩家有效\nIsOccupied - 等待玩家處於忙碌狀態\nBNpcInRadius - 等待戰鬥 NPC 生成或移動進入指定半徑內\nExample: WaitFor|-12.12, 18.76, -148.05|Combat
Adds a Boss step to the path; after (and while) moving to the position, AutoDuty will attempt to find the boss object. If not found, AD will wait 10s at the position for the boss to spawn and will then Invoke the Boss Action.\nExample: Boss|-2.91, 2.90, -204.68|==在路徑中新增一個王戰步驟；在移動到該座標的過程中與抵達後，AutoDuty 會嘗試尋找王的物件。若找不到，AD 會在該座標等待 10 秒讓王生成，接著執行王戰動作。\nExample: Boss|-2.91, 2.90, -204.68|
Adds an Interactable step to the path; after moving to within 2y of the position, AutoDuty will interact with the object specified (recommended to input DataId) until either the object is no longer targetable, you meet certain conditions, or a YesNo/Talk addon appears.\nExample: Interactable|21.82, 7.10, 27.40|1004346 (Goblin Pathfinder)==在路徑中新增一個互動步驟；移動到距離該座標 2 米內後，AutoDuty 會與指定的物件互動（建議輸入 DataId），直到該物件無法選取、滿足特定條件，或出現 YesNo／Talk 介面為止。\nExample: Interactable|21.82, 7.10, 27.40|1004346 (Goblin Pathfinder)
Adds a TreasureCoffer flag to the path; AutoDuty will loot any treasure coffers automatically if it gets within interact range of one (while Config Loop Option is on), this is just a flag to mark the positions of Treasure Coffers.\nNote: AutoDuty will ignore this Path entry when Looting is disabled entirely or Boss Loot Only is enabled.\nExample: TreasureCoffer|3.21, 6.06, -97.63|==在路徑中新增一個寶箱標記；只要進入寶箱的互動範圍，AutoDuty 就會自動拾取寶箱（需啟用設定中的循環選項），此步驟只是用來標記寶箱位置的旗標。\n注意：當完全停用拾取或啟用「僅拾取王的寶箱」時，AutoDuty 會忽略此路徑項目。\nExample: TreasureCoffer|3.21, 6.06, -97.63|
Adds a SelectYesNo step to the path; after moving to the position, AutoDuty will click Yes or No on this addon.\nExample: SelectYesno|9.41, 1.94, -311.25|Yes==在路徑中新增一個 SelectYesNo 步驟；移動到該座標後，AutoDuty 會在該介面上點擊 Yes 或 No。\nExample: SelectYesno|9.41, 1.94, -311.25|Yes
Adds a SelectString step to the path; after moving to the position, AutoDuty will pick the indexed string.\nExample: SelectYesno|908.24, 327.26, -561.96|1==在路徑中新增一個 SelectString 步驟；移動到該座標後，AutoDuty 會選取指定索引的選項。\nExample: SelectYesno|908.24, 327.26, -561.96|1
Adds a MoveToObject step to the path; AutoDuty will will move the object specified (recommend input DataId)==在路徑中新增一個 MoveToObject 步驟；AutoDuty 會移動到指定的物件（建議輸入 DataId）
Adds a DutySpecificCode step to the path; after moving to the position, AutoDuty will invoke the Duty Specific Action for this TerritoryType and the step # specified.\nExample: DutySpecificCode|174.68, 102.00, -66.46|1==在路徑中新增一個 DutySpecificCode 步驟；移動到該座標後，AutoDuty 會執行對應此 TerritoryType 與指定步驟編號的副本專屬動作。\nExample: DutySpecificCode|174.68, 102.00, -66.46|1
Adds a BossMod step to the path; after moving to the position, AutoDuty will turn BossMod on or off.\nExample: BossMod|-132.08, -342.25, 1.98|Off==在路徑中新增一個 BossMod 步驟；移動到該座標後，AutoDuty 會開啟或關閉 BossMod。\nExample: BossMod|-132.08, -342.25, 1.98|Off
Adds a Rotation step to the path; after moving to the position, AutoDuty will turn Rotation Plugin on or off.\nExample: Rotation|-132.08, -342.25, 1.98|Off==在路徑中新增一個 Rotation 步驟；移動到該座標後，AutoDuty 會開啟或關閉連段插件。\nExample: Rotation|-132.08, -342.25, 1.98|Off
Adds a Target step to the path; after moving to the position, AutoDuty will Target the object specified (recommend inputing DataId).==在路徑中新增一個 Target 步驟；移動到該座標後，AutoDuty 會鎖定指定的物件（建議輸入 DataId）。
Adds an AutoMoveFor step to the path; AutoDuty will turn on Standard Mode and Auto Move for the time specified in milliseconds (or until player is not ready).\nExample: AutoMoveFor|-18.21, 1.61, 114.16|3000==在路徑中新增一個 AutoMoveFor 步驟；AutoDuty 會切換成標準模式並自動前進指定的毫秒數（或直到玩家未就緒為止）。\nExample: AutoMoveFor|-18.21, 1.61, 114.16|3000
Adds a ChatCommand step to the path; after moving to the position, AutoDuty will execute the Command specified.\nExample: ChatCommand|-5.86, 164.00, 501.72|/bmrai follow Alisaie==在路徑中新增一個 ChatCommand 步驟；移動到該座標後，AutoDuty 會執行指定的指令。\nExample: ChatCommand|-5.86, 164.00, 501.72|/bmrai follow Alisaie
Adds a StopForCombat step to the path; after moving to the position, AutoDuty will turn StopForCombat on or off.\nExample: StopForCombat|-1.36, 5.76, -108.78|False==在路徑中新增一個 StopForCombat 步驟；移動到該座標後，AutoDuty 會開啟或關閉「遇敵停下作戰」。\nExample: StopForCombat|-1.36, 5.76, -108.78|False
Adds a Revive flag to the path; this is just a flag to mark the positions of Revival Points, AutoDuty will ignore this step during navigation.\nUse this if the Revive Teleporter does not take you directly to the arena of the last boss you killed, such as Sohm Al.\nExample: Revival|33.57, -202.93, -70.30|==在路徑中新增一個復活標記；此步驟只是用來標記復活點位置的旗標，AutoDuty 在導航時會略過它。\n若復活傳送不會直接把你送回最後擊敗的王所在的場地（例如索姆阿爾靈峰），請使用此標記。\nExample: Revival|33.57, -202.93, -70.30|
Adds a ForceAttack step to the path; after moving to the position, AutoDuty will ForceAttack the closest mob.\nExample: ForceAttack|-174.24, 6.56, -301.67|==在路徑中新增一個 ForceAttack 步驟；移動到該座標後，AutoDuty 會強制攻擊最近的敵人。\nExample: ForceAttack|-174.24, 6.56, -301.67|
Adds a Jump step to the path; after AutoMoving, AutoDuty will jump.\nExample: Jump|0, 0, 0|200==在路徑中新增一個跳躍步驟；自動前進之後，AutoDuty 會跳躍。\nExample: Jump|0, 0, 0|200
Adds a CameraFacing step to the path; after moving to the position, AutoDuty will face the coordinates specified.\nExample: CameraFacing|720.66, 57.24, 9.18|722.05, 62.47, 15.55==在路徑中新增一個 CameraFacing 步驟；移動到該座標後，AutoDuty 會面向指定的座標。\nExample: CameraFacing|720.66, 57.24, 9.18|722.05, 62.47, 15.55
Adds a ClickTalk step to the path; after moving to the position, AutoDuty will click the talk addon.==在路徑中新增一個 ClickTalk 步驟；移動到該座標後，AutoDuty 會點擊對話介面。
Adds a ConditionAction step to the path; after moving to the position, AutoDuty will check the condition specified and invoke Action.==在路徑中新增一個 ConditionAction 步驟；移動到該座標後，AutoDuty 會檢查指定的條件並執行動作。
Adds a ModifyIndex step to the path; after moving to the position, AutoDuty will modify the index. A leading + or - makes it relative to this step (-1 redoes the previous step); otherwise it is an absolute 0-based index.\nExample: ModifyIndex|0, 0, 0|-1==在路徑中新增一個 ModifyIndex 步驟；移動到該座標後，AutoDuty 會修改索引。開頭加 + 或 - 表示相對於本步驟位移（-1 代表重做上一步）；否則視為從 0 起算的絕對索引。\nExample: ModifyIndex|0, 0, 0|-1
