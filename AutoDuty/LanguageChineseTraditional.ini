AutoDuty works with the plugins below. These links point at this fleet's own Traditional Chinese forks - AutoDuty will not install anything for you, because installing the international builds would replace your fork of the same plugin with a version that does not work here.==AutoDuty 可搭配下列插件使用。這些連結指向本站自行維護的繁體中文版本;AutoDuty 不會自動幫你安裝任何東西,因為安裝國際服版本會把你同名的插件換成在這裡不能用的版本。
Coordinates several game clients running AutoDuty together.\n\nWhat currently works: the host invites the clients to its party, the host's queue makes the clients accept their duty pop, and deaths are reported to the host.\n\nNot yet wired up: per-step lockstep along the path and sending the host's path to the clients. Clients still walk their own path on their own timing.\n\nThis switch is never saved - AutoDuty always starts with Multibox off, and nothing turns it on by itself. You must tick it manually on every client each time.==讓多個執行 AutoDuty 的遊戲客戶端互相協調。\n\n目前可用:主機會邀請各客戶端加入小隊、主機報名後各客戶端會接受跳出的任務確認、死亡狀態會回報給主機。\n\n尚未接線:沿路徑的逐步同步,以及把主機的路徑發送給客戶端。各客戶端目前仍依自己的節奏走自己的路徑。\n\n這個開關不會被儲存 —— AutoDuty 每次啟動時多開同步都是關閉的,也沒有任何程式會自己把它打開。每次都必須在每個客戶端手動勾選。
Enable Multibox==啟用多開同步
Exactly one game client must be the host. The host runs the path and drives everyone else; the others follow.==必須剛好有一個遊戲客戶端擔任主機。主機負責跑路徑並指揮其他客戶端,其餘的跟隨。
Intended to make the host send its loaded path to every client. The transport for this exists but nothing calls it yet, so this setting currently has no effect - each client still uses its own path file.==原本的用途是讓主機把載入的路徑發送給每個客戶端。傳輸層已經做好,但目前還沒有任何地方會呼叫它,所以這個選項現在沒有作用,各客戶端仍使用自己的路徑檔。
