AutoDuty stopped on its own.==AutoDuty 自己停下來了。
Notify when AutoDuty stops on its own==AutoDuty 自己停下來時發出通知
Shows a Dalamud notification when AutoDuty stops because it finished all loops or hit an error. Stopping it yourself never notifies.==AutoDuty 因為跑完所有輪迴或發生錯誤而停下來時,跳出一則 Dalamud 通知。你自己按停止則不會通知。
Ask Tataru to speak when AutoDuty stops on its own (requires TataruPraise)==AutoDuty 自己停下來時請塔塔露出聲（需要 TataruPraise）
Needs the TataruPraise plugin installed and its own master switch turned on. Without it this option does nothing at all - no error, no sound. Stopping AutoDuty yourself never speaks.==需要安裝 TataruPraise 並開啟它自己的總開關。沒有的話這個選項完全不會做任何事，不報錯、也不出聲。你自己按停止永遠不會出聲。
Task timeouts: ??==任務逾時:?? 次
A queued step ran past its time limit. AutoDuty does not stop on a timeout, it just moves on, so a boss fight or a treasure chest may have been skipped.==佇列裡的某一步超過時限還沒做完。AutoDuty 遇到逾時不會停下來,而是直接往下一步跑 —— 所以王戰或寶箱可能已經被跳過了。
Last timed-out task: ??==最後一次逾時的任務:??
Last occurrence: ?? ago==最後一次發生於 ?? 前
This run: ??, this session: ??==本次執行 ?? 次,本工作階段 ?? 次
Full details are in the Dalamud log (search for TaskTimeout).==完整細節在 Dalamud 日誌裡(搜 TaskTimeout)。
Runs Grand Company expert delivery at the end of each loop. AutoDuty travels to your Grand Company, then AutoRetainer hands in the gear in your inventory.\n\nIt never switches character and never starts AutoRetainer's multi-character loop.\n\nHeads up: AutoRetainer runs its full Deliver Items flow, which visits the quartermaster and spends your Grand Company seals on ventures before handing anything in. To keep a reserve, set 'Seals to keep' in AutoRetainer's Grand Company exchange plan.==每輪結束後執行大國防聯軍的籌備稀有品繳交。由 AutoDuty 前往所屬大國防聯軍駐地，再由 AutoRetainer 把背包裡的裝備繳交出去。\n\n不會切換角色，也不會啟動 AutoRetainer 的多角色循環。\n\n注意：AutoRetainer 走的是完整的繳交流程，會先找補給負責人，把軍票拿去購買探險幣，之後才開始繳交。要保留軍票請在 AutoRetainer 的兌換計畫裡設定 Seals to keep。
Force BossMod AutoRotation only==強制只用 BossMod AutoRotation
Combat always runs on BossMod's own AutoRotation, even when Wrath Combo or Rotation Solver is installed - AutoDuty turns those off instead of handing the rotation over to them.\n\nWhy you would want this: some bosses mark one specific enemy as a priority target, such as an add that has to die first. That priority lives inside BossMod's boss module and only BossMod's own AutoRotation reads it - Wrath Combo and Rotation Solver never see it and keep picking targets by their own rules (biggest hitbox, highest HP and so on), so they will not switch to that add on their own.==開啟後戰鬥輸出一律走 BossMod 自己的 AutoRotation,就算裝了 Wrath Combo 或 Rotation Solver 也一樣 —— AutoDuty 會主動把它們關掉,不再把循環交給它們。\n\n為什麼要開:有些王會把某個敵人標成優先目標,例如必須先解掉、否則會團滅的 add。這個優先度只存在 BossMod 的王模組裡,也只有 BossMod 自己的 AutoRotation 讀得到 —— Wrath Combo 和 Rotation Solver 完全看不到,只會照自己的選怪規則打(體型最大、血量最高之類),不會主動改打那個 add。
* Forcing BossMod AutoRotation requires the BossMod plugin==＊「強制只用 BossMod AutoRotation」需要有安裝 BossMod
